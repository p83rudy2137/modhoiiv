 SLS_POLITICIAN_KORFANTY_DESC:0 "Wojciech Korfanty, weteran Powstań Śląskich, prowadzi niepodległą Republikę Śląską pewną ręką. Jego demokratyczna wizja ma uczynić z przemysłowego serca Europy oazę dobrobytu i stabilności."
 SLS_POLITICIAN_SKR_DESC:0 "Śląski Komitet Robotniczy reprezentuje rewolucyjne dążenia proletariatu górnośląskiego, walcząc o nacjonalizację kopalń i hut oraz sojusz z ruchem robotniczym."
 SLS_POLITICIAN_DP_DESC:0 "Dowództwo Powstańcze czerpie tradycje z bojów powstańczych, stawiając na militaryzację, dyscyplinę oraz obronę śląskiej ziemi przed zakusami sąsiadów."
