l_polish:
 SLS_wezel_weglowy:0 "Węzeł Węglowy"
 SLS_wezel_weglowy_desc:0 "Śląskie zagłębie węglowo-hutnicze stanowi serce przemysłowe Europy Środkowej, zapewniając ogromną wydajność fabryk i surowców."
 SLS_gornicza_tozsamosc:0 "Górnicza Tożsamość"
 SLS_gornicza_tozsamosc_desc:0 "Pokolenia ciężkiej pracy pod ziemią wykształciły w Ślązakach żelazną dyscyplinę, niezłomność i kunszt w umacnianiu pozycji obronnych."
 SLS_oblenzona_twierdza_idea:0 "Oblężona Twierdza"
 SLS_oblenzona_twierdza_idea_desc:0 "Otoczeni przez niechętnych sąsiadów, przekształcamy Śląsk w niezdobytą redutę, której mieszkańcy będą bronić do ostatniego tchu."
 SLS_nacjonalizacja_kopaln_idea:0 "Nacjonalizacja Kopalń i Hut"
 SLS_nacjonalizacja_kopaln_idea_desc:0 "Śląskie bogactwa w rękach komitetów robotniczych: maksymalizacja wydobycia węgla i stali z korzyścią dla państwa."
 SLS_gwardia_idea:0 "Gwardia Obywatelska"
 SLS_gwardia_idea_desc:0 "Lokalne formacje samoobrony złożone z górników i robotników strzegące swoich rodzinnych miejscowości."
 SLS_zbrojownia_idea:0 "Zbrojownia Wolnej Europy"
 SLS_zbrojownia_idea_desc:0 "Huty pracujące pełną parą dostarczają broń, amunicję i stal dla państw demokratycznych."
 SLS_coal_export:0 "Eksport Węgla do Europy"
 SLS_coal_export_desc:0 "Dostawy śląskiego węgla na Zachód otwierają nam drzwi salonów dyplomatycznych i przynoszą zyski."
 SLS_czerwona_gwardia_idea:0 "Czerwona Gwardia Górnicza"
 SLS_czerwona_gwardia_idea_desc:0 "Oddana sprawie rewolucji formacja robotnicza zasilająca szeregi naszej armii."
 SLS_militaryzm_idea:0 "Śląski Militaryzm"
 SLS_militaryzm_idea_desc:0 "Powszechny szacunek dla munduru, wysoki pobór i skrócony czas szkolenia rekrutów."
 SLS_military_economy_idea:0 "Militaryzacja Przemysłu"
 SLS_military_economy_idea_desc:0 "Całkowite podporządkowanie hutnictwa i maszynowni potrzebom sił zbrojnych."
 SLS_totalna_samoobrona_idea:0 "Totalna Samoobrona"
 SLS_totalna_samoobrona_idea_desc:0 "Każdy szyb, zakład i hałda przygotowane do długotrwałego oporu."
 SLS_alliance_opinion:0 "Śląskie Porozumienie Obronne"
 SLS_trade_opinion:0 "Śląski Traktat Handlowy"
 SLS_hostile_opinion:0 "Napięcia na Śląskiej Granicy"
 SLS_hostile_50_opinion:0 "Śląska Nieustępliwość"