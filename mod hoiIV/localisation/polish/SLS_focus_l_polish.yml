l_polish:
 SLS_rozbudowa_huty_batory:0 "Rozbudowa Huty Batory"
 SLS_rozbudowa_huty_batory_desc:0 "Huta Batory musi zostać zmodernizowana i rozbudowana o nowoczesne piece, kładąc podwaliny pod rodzimy przemysł zbrojeniowy."
 SLS_weglowe_el_dorado:0 "Węglowe El Dorado"
 SLS_weglowe_el_dorado_desc:0 "Górnośląskie czarne złoto to fundament naszej suwerenności. Intensyfikacja wydobycia i rozbudowa torowisk zabezpieczą naszą gospodarkę."
 SLS_inwestycje_w_motoryzacje:0 "Inwestycje w Motoryzację"
 SLS_inwestycje_w_motoryzacje_desc:0 "Śląskie zakłady mechaniczne rozpoczną seryjną produkcję ciężarówek oraz pojazdów opancerzonych dla naszej armii."
 SLS_wlasna_siec_logistyczna:0 "Własna Sieć Logistyczna"
 SLS_wlasna_siec_logistyczna_desc:0 "Połączenie Mikołowa, Wyrów i Katowic nowoczesną magistralą kolejową i węzłami zaopatrzenia zagwarantuje bezbłędną aprowizację."
 SLS_gwardia_obywatelska:0 "Gwardia Obywatelska"
 SLS_gwardia_obywatelska_desc:0 "Każdy obywatel i górnik to obrońca ojczyzny. Lokalne bataliony obronne będą bezwzględnie bronić śląskiej ziemi."
 SLS_inzynieria_gornicza:0 "Inżynieria Górnicza"
 SLS_inzynieria_gornicza_desc:0 "Górnicze doświadczenie w drążeniu chodników pozwala błyskawicznie budować potężne podziemne bunkry i umocnienia."
 SLS_modernizacja_sprzetu:0 "Modernizacja Sprzętu"
 SLS_modernizacja_sprzetu_desc:0 "Ujednolicenie kalibrów i wdrożenie nowoczesnych wzorów uzbrojenia piechoty i artylerii."
 SLS_slaski_cud_gospodarczy:0 "Śląski Cud Gospodarczy"
 SLS_slaski_cud_gospodarczy_desc:0 "Szwajcaria Wschodu: Niskie podatki, stabilna waluta i rozwój wolnego handlu przyciągają kapitał z całej Europy."
 SLS_pakt_z_warszawa:0 "Pakt z Warszawą"
 SLS_pakt_z_warszawa_desc:0 "Podpisanie sojuszu obronnego z Rzecząpospolitą Polską i wzajemne gwarancje integralności terytorialnej."
 SLS_eksport_wegla:0 "Eksport Węgla do Europy"
 SLS_eksport_wegla_desc:0 "Zasilenie gospodarek Wielkiej Brytanii i Francji śląskim węglem, zacieśniając więzi dyplomatyczne."
 SLS_gwarancje_zachodu:0 "Gwarancje Zachodu"
 SLS_gwarancje_zachodu_desc:0 "Uzyskanie oficjalnych gwarancji niepodległości od Londynu i Paryża w obliczu zagrożenia hitlerowskiego."
 SLS_zbrojownia_europy:0 "Zbrojownia Europy"
 SLS_zbrojownia_europy_desc:0 "Śląskie fabryki produkują nowoczesną broń, działa i czołgi dla wolnego świata walczącego z tyranią."
 SLS_strajk_generalny:0 "Strajk Generalny"
 SLS_strajk_generalny_desc:0 "Czerwony sztandar nad szybami kopalń! Władzę przejmują rady robotnicze i komitety fabryczne."
 SLS_nacjonalizacja_kopaln:0 "Nacjonalizacja Kopalń i Hut"
 SLS_nacjonalizacja_kopaln_desc:0 "Wywłaszczenie zagranicznych koncernów i magnatów. Śląskie bogactwa naturalne należą wyłącznie do ludu pracującego."
 SLS_czerwona_gwardia:0 "Czerwona Gwardia Górnicza"
 SLS_czerwona_gwardia_desc:0 "Uzbrojone oddziały robotnicze stają na straży rewolucji, gotowe do walki o wolność klasy robotniczej."
 SLS_delegacja_do_moskwy:0 "Delegacja do Moskwy"
 SLS_delegacja_do_moskwy_desc:0 "Wysłanie poselstwa na Kreml i przystąpienie do Międzynarodówki Komunistycznej (Komintern)."
 SLS_eksport_rewolucji:0 "Eksport Rewolucji"
 SLS_eksport_rewolucji_desc:0 "Wyzwalający marsz na Warszawę i Pragę w celu wyzwolenia proletariatu z rąk burżuazji."
 SLS_slaska_sila_zbrojna:0 "Śląska Siła Zbrojna"
 SLS_slaska_sila_zbrojna_desc:0 "Tylko żelazna dyscyplina, patriotyzm i silna armia mogą zapewnić przetrwanie śląskiemu narodowi."
 SLS_roszczenia_zaolzie:0 "Roszczenia wobec Zaolzia"
 SLS_roszczenia_zaolzie_desc:0 "Śląsk Cieszyński i Zaolzie muszą powrócić do macierzy. Wystosowanie ultimatum pod adresem Pragi."
 SLS_pakt_z_diablem:0 "Pakt z Diabłem"
 SLS_pakt_z_diablem_desc:0 "Pragmatyczny sojusz z III Rzeszą przeciwko Polsce w celu zabezpieczenia śląskich interesów."
 SLS_militaryzacja_przemyslu:0 "Militaryzacja Przemysłu"
 SLS_militaryzacja_przemyslu_desc:0 "Przestawienie całości gospodarki na tory wojenne: pancerze, pociski i karabiny 24 godziny na dobę."
 SLS_rewizja_granic:0 "Rewizja Granic"
 SLS_rewizja_granic_desc:0 "Żądanie zwrotu Opolszczyzny, Dolnego Śląska i czeskich Moraw – stworzenie zjednoczonego Wielkiego Śląska."
 SLS_slask_dla_slazakow:0 "Śląsk dla Ślązaków!"
 SLS_slask_dla_slazakow_desc:0 "Żadnych kompromisów z Warszawą, Berlinem ani Pragą. Samostanowienie i pełna duma narodowa."
 SLS_wyrzucenie_kapitalu:0 "Wyrzucenie Zagranicznego Kapitału"
 SLS_wyrzucenie_kapitalu_desc:0 "Zerwanie krzywdzących układów handlowych. Śląski przemysł ma służyć wyłącznie mieszkańcom naszej ziemi."
 SLS_bariera_wisla_odra:0 "Bariera na Wiśle i Odrze"
 SLS_bariera_wisla_odra_desc:0 "Budowa potężnych linii bunkrów, zapór przeciwpancernych i pól minowych wzdłuż granicznych rzek."
 SLS_totalna_samoobrona:0 "Totalna Samoobrona"
 SLS_totalna_samoobrona_desc:0 "Każdy dom, kopalnia i huta staje się niezdobytą twierdzą. Pełny pobór i powszechne przeszkolenie ludności."
 SLS_prewencyjne_uderzenie:0 "Prewencyjne Uderzenie"
 SLS_prewencyjne_uderzenie_desc:0 "Najlepszą obroną jest atak! Zaskakujący cios na sąsiadów w celu utworzenia stref bezpieczeństwa."
 SLS_hegemonia_z_wyrow:0 "Hegemonia z Wyrów"
 SLS_hegemonia_z_wyrow_desc:0 "Ze stołecznych Wyrów kierujemy nowym ładem w Europie Środkowej, tworząc podporządkowane strefy buforowe."