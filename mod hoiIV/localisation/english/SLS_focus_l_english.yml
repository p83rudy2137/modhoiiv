l_english:
 SLS_rozbudowa_huty_batory:0 "Expansion of Huta Batory"
 SLS_rozbudowa_huty_batory_desc:0 "The Batory Steelworks must be revitalized and expanded with modern blast furnaces, laying the foundation for our domestic defense industry."
 SLS_weglowe_el_dorado:0 "Coal El Dorado"
 SLS_weglowe_el_dorado_desc:0 "Upper Silesian black gold fuels our independence. Intensive mining and railway infrastructure modernization will secure our economic autonomy."
 SLS_inwestycje_w_motoryzacje:0 "Automotive Investments"
 SLS_inwestycje_w_motoryzacje_desc:0 "Our mechanics and workshops must master motorized production, developing domestic trucks and mechanized transport."
 SLS_wlasna_siec_logistyczna:0 "Silesian Logistics Network"
 SLS_wlasna_siec_logistyczna_desc:0 "By connecting Mikołów, Wyry, and Katowice with modern railways and supply hubs, our logistical readiness will be unmatched."
 SLS_gwardia_obywatelska:0 "Civic Guard"
 SLS_gwardia_obywatelska_desc:0 "Every citizen and miner is a defender of the homeland. Local defense battalions will fiercely protect Silesian soil."
 SLS_inzynieria_gornicza:0 "Mining Fortification Engineering"
 SLS_inzynieria_gornicza_desc:0 "Expertise in deep-shaft mining translates directly to constructing impregnable underground bunkers and concrete defense lines."
 SLS_modernizacja_sprzetu:0 "Equipment Modernization"
 SLS_modernizacja_sprzetu_desc:0 "Standardize rifle and artillery production, ensuring our troops are armed with reliable weapons."
 SLS_slaski_cud_gospodarczy:0 "Silesian Economic Miracle"
 SLS_slaski_cud_gospodarczy_desc:0 "Switzerland of the East: A thriving free market, reliable banking, and stable democracy attract European investments."
 SLS_pakt_z_warszawa:0 "Pact with Warsaw"
 SLS_pakt_z_warszawa_desc:0 "Our brotherly republic to the north shares our interests. Let us formalize military cooperation and reciprocal guarantees."
 SLS_eksport_wegla:0 "Coal Export to Europe"
 SLS_eksport_wegla_desc:0 "Supply Britain, France, and Central Europe with high-grade anthracite, solidifying our diplomatic leverage."
 SLS_gwarancje_zachodu:0 "Western Guarantees"
 SLS_gwarancje_zachodu_desc:0 "Seek formal security guarantees from Great Britain and France to deter expansionist aggression."
 SLS_zbrojownia_europy:0 "Armory of Free Europe"
 SLS_zbrojownia_europy_desc:0 "Our factories will churn out tanks, artillery, and munitions for democratic nations resisting totalitarian aggression."
 SLS_strajk_generalny:0 "General Strike"
 SLS_strajk_generalny_desc:0 "The working class raises the red banner. The factories and pits are placed under democratic workers' control."
 SLS_nacjonalizacja_kopaln:0 "Nationalization of Mines and Steelworks"
 SLS_nacjonalizacja_kopaln_desc:0 "Expropriate foreign capitalists and oligarchs. Silesian natural wealth belongs entirely to the people."
 SLS_czerwona_gwardia:0 "Red Miners' Guard"
 SLS_czerwona_gwardia_desc:0 "Armed miner militias stand ready to safeguard our revolution with blood and iron."
 SLS_delegacja_do_moskwy:0 "Delegation to Moscow"
 SLS_delegacja_do_moskwy_desc:0 "Send envoys to the Soviet Union, proposing membership in the Comintern and united anti-fascist solidarity."
 SLS_eksport_rewolucji:0 "Export of the Revolution"
 SLS_eksport_rewolucji_desc:0 "Liberate our class brothers in Poland and Czechoslovakia from capitalist and imperialist oppression."
 SLS_slaska_sila_zbrojna:0 "Silesian Armed Might"
 SLS_slaska_sila_zbrojna_desc:0 "Only an uncompromising, heavily armed military state can survive between aggressive giants."
 SLS_roszczenia_zaolzie:0 "Claims on Zaolzie"
 SLS_roszczenia_zaolzie_desc:0 "Cieszyn Silesia and the Olza region belong historically and ethnically to Upper Silesia. We shall reclaim what is ours."
 SLS_pakt_z_diablem:0 "Pact with the Devil"
 SLS_pakt_z_diablem_desc:0 "Negotiate pragmatic non-aggression and cooperation with the Third Reich to divide spheres of influence."
 SLS_militaryzacja_przemyslu:0 "Militarization of Heavy Industry"
 SLS_militaryzacja_przemyslu_desc:0 "All civilian production is subordinated to the military machinery: shells, guns, and armor around the clock."
 SLS_rewizja_granic:0 "Revision of Historical Borders"
 SLS_rewizja_granic_desc:0 "Reclaim Opole, Lower Silesia, and northern Moravia to unite all historic Silesian lands under our banner."
 SLS_slask_dla_slazakow:0 "Silesia for Silesians!"
 SLS_slask_dla_slazakow_desc:0 "No submission to Berlin, Warsaw, or Moscow. Complete uncompromising sovereignty and self-reliance."
 SLS_wyrzucenie_kapitalu:0 "Expulsion of Foreign Capital"
 SLS_wyrzucenie_kapitalu_desc:0 "Confiscate all foreign assets and end exploitative trade treaties. Silesian industry serves Silesia alone."
 SLS_bariera_wisla_odra:0 "Vistula-Oder Defensive Barrier"
 SLS_bariera_wisla_odra_desc:0 "Construct layers of deep concrete bunkers, tank traps, and minefields along the border rivers."
 SLS_totalna_samoobrona:0 "Total Self-Defense"
 SLS_totalna_samoobrona_desc:0 "Mobilize every able-bodied person into defensive corps. Turn every pit, hamlet, and factory into a citadel."
 SLS_prewencyjne_uderzenie:0 "Preemptive Buffer Strikes"
 SLS_prewencyjne_uderzenie_desc:0 "The best defense is an unexpected offense. Strike into neighboring territories to establish protective buffer zones."
 SLS_hegemonia_z_wyrow:0 "Hegemony from Wyry"
 SLS_hegemonia_z_wyrow_desc:0 "From the heroic capital of Wyry, Silesia dominates Central Europe, subjugating neighbors into protective satellite states."