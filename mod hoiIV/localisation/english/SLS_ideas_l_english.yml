 SLS_wezel_weglowy:0 "The Coal Hub"
 SLS_wezel_weglowy_desc:0 "Silesian coal fields represent the industrial core of Central Europe, granting massive industrial efficiency and resource throughput."
 SLS_gornicza_tozsamosc:0 "Mining Identity"
 SLS_gornicza_tozsamosc_desc:0 "Decades of relentless underground labor have forged a population renowned for discipline, endurance, and defensive mastery."
 SLS_oblenzona_twierdza_idea:0 "Besieged Fortress"
 SLS_oblenzona_twierdza_idea_desc:0 "Surrounded by suspicious rivals, Silesia stands as an impregnable citadel where every inch of native soil is contested fiercely."
 SLS_nacjonalizacja_kopaln_idea:0 "Nationalized Mines and Foundries"
 SLS_nacjonalizacja_kopaln_idea_desc:0 "With production brought under public administration, resources flow straight into industrial and military development."
 SLS_gwardia_idea:0 "Miners' Civic Guard"
 SLS_gwardia_idea_desc:0 "Organized citizen-miners ready to take up arms at a moment's notice to defend their hometowns."
 SLS_zbrojownia_idea:0 "European Armory"
 SLS_zbrojownia_idea_desc:0 "Silesian foundries and machine works operate at maximum tempo supplying frontline weaponry."
 SLS_coal_export:0 "European Coal Contracts"
 SLS_coal_export_desc:0 "Crucial coal exports to London and Paris secure political goodwill and industrial building materials."
 SLS_czerwona_gwardia_idea:0 "Red Miners' Guard"
 SLS_czerwona_gwardia_idea_desc:0 "A vanguard of ideologically dedicated proletarians providing manpower and relentless fighting spirit."
 SLS_militaryzm_idea:0 "Silesian Militarism"
 SLS_militaryzm_idea_desc:0 "A nation in arms: rapid training cycles and extensive conscription ensure a formidable standing force."
 SLS_military_economy_idea:0 "Total War Economy"
 SLS_military_economy_idea_desc:0 "Every forge, press, and lathe is dedicated to producing war munitions."
 SLS_totalna_samoobrona_idea:0 "Total Self-Defense"
 SLS_totalna_samoobrona_idea_desc:0 "Every settlement, minehead, and pithead is transformed into a reinforced strongpoint."
 SLS_alliance_opinion:0 "Silesian Defense Understanding"
 SLS_trade_opinion:0 "Silesian Trade Accord"
 SLS_hostile_opinion:0 "Silesian Border Tensions"
 SLS_hostile_50_opinion:0 "Silesian Defiance"