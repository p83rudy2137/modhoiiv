 SLS_POLITICIAN_KORFANTY_DESC:0 "Wojciech Korfanty, veteran of the Silesian Uprisings, leads the independent Silesian Republic with a steady hand. His democratic vision aims to transform the industrial basin into a beacon of freedom and prosperity in Central Europe."
 SLS_POLITICIAN_SKR_DESC:0 "The Silesian Workers' Committee represents the revolutionary aspirations of the mining and smelting proletariat, seeking workers' self-rule and fraternity with the international labor movement."
 SLS_POLITICIAN_DP_DESC:0 "The Insurgent Command draws on the militant legacy of the Silesian struggles, determined to secure Silesia's borders through armed strength, iron discipline, and unity."
